<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeHindiZone</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* HEADER */

header{
    background:#15151d;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #252532;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#ff3d71;
}

nav{
    display:flex;
    align-items:center;
    gap:18px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#ff3d71;
}

/* HERO */

.hero{
    padding:50px 5%;
    background:
    linear-gradient(
        135deg,
        #181827,
        #0b0b0f
    );
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:#aaa;
}

/* CONTAINER */

.container{
    padding:30px 5%;
}

.section-title{
    font-size:24px;
    margin-bottom:20px;
}

/* SEARCH */

.search-box{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#171720;
    color:#fff;
    margin-bottom:25px;
    font-size:15px;
}

.search-box::placeholder{
    color:#777;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:
    repeat(
        auto-fill,
        minmax(160px,1fr)
    );
    gap:18px;
}

/* CARD */

.card{
    background:#15151d;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    border:1px solid #24242f;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#ff3d71;
    box-shadow:
    0 8px 25px
    rgba(255,61,113,.15);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    background:#20202a;
}

.card-info{
    padding:12px;
}

.card-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}

.card-status{
    color:#ff3d71;
    font-size:12px;
}

/* LOADING */

.loading{
    text-align:center;
    color:#aaa;
    padding:35px;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#aaa;
    padding:35px;
}

/* ERROR */

.error-box{
    background:#241116;
    border:1px solid #ff3d71;
    border-radius:8px;
    padding:18px;
    color:#ffb3c5;
    word-break:break-word;
}

/* FOOTER */

footer{
    margin-top:50px;
    padding:25px;
    text-align:center;
    background:#15151d;
    color:#888;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:15px 4%;
    }

    .logo{
        font-size:20px;
    }

    nav{
        gap:10px;
    }

    nav a{
        font-size:11px;
    }

    .hero{
        padding:40px 5%;
    }

    .hero h1{
        font-size:27px;
    }

    .grid{
        grid-template-columns:
        repeat(2,1fr);

        gap:12px;
    }

    .card img{
        height:220px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        AnimeHindiZone
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="#latest">
            Latest
        </a>

        <a href="#popular">
            Popular
        </a>

        <a href="#schedule">
            Schedule
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Watch Anime in Hindi
    </h1>

    <p>
        Latest anime, episodes and more.
    </p>

</section>


<!-- =========================
     LATEST ANIME
========================= -->

<div class="container">

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search anime..."
    >

    <h2
        class="section-title"
        id="latest"
    >
        Latest Anime
    </h2>


    <div
        id="animeGrid"
        class="grid"
    >

        <div class="loading">
            Loading anime...
        </div>

    </div>

</div>


<!-- =========================
     POPULAR
========================= -->

<div
    class="container"
    id="popular"
>

    <h2 class="section-title">
        Popular Anime
    </h2>


    <div
        id="popularGrid"
        class="grid"
    >

    </div>

</div>


<!-- =========================
     SCHEDULE
========================= -->

<div
    class="container"
    id="schedule"
>

    <h2 class="section-title">
        Anime Schedule
    </h2>


    <div class="empty">

        Schedule system coming soon...

    </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 AnimeHindiZone

</footer>



<script>


/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://gmacsiymybvfcxydvkla.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";


/* =====================================
   GLOBAL DATA
===================================== */

let allAnime = [];


/* =====================================
   LOAD ANIME
===================================== */

async function loadAnime(){

    const grid =
        document.getElementById(
            "animeGrid"
        );


    grid.innerHTML = `

        <div class="loading">
            Loading anime...
        </div>

    `;


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/anime" +
            "?select=id,anime_id,title,thumbnail_url,banner_url,description,genre,season,language,status" +
            "&order=id.desc";


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    }
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();


            throw new Error(
                "Supabase HTTP " +
                response.status +
                ": " +
                errorText
            );

        }


        const data =
            await response.json();


        console.log(
            "Anime data:",
            data
        );


        allAnime =
            Array.isArray(data)
            ? data
            : [];


        displayAnime(
            allAnime
        );

    }


    catch(error){

        console.error(
            "Anime loading error:",
            error
        );


        grid.innerHTML = `

            <div class="error-box">

                <strong>
                    Anime load nahi ho pa raha.
                </strong>

                <br><br>

                Error:
                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================
   DISPLAY ANIME
===================================== */

function displayAnime(
    animeList
){

    const grid =
        document.getElementById(
            "animeGrid"
        );


    if(
        !animeList ||
        animeList.length === 0
    ){

        grid.innerHTML = `

            <div class="empty">

                Abhi koi anime add nahi hua.

            </div>

        `;


        document
            .getElementById(
                "popularGrid"
            )
            .innerHTML = "";


        return;

    }


    grid.innerHTML =
        animeList.map(
            anime => {

                const title =
                    anime.title ||
                    "Unknown Anime";


                const animeId =
                    anime.anime_id ||
                    "";


                const thumbnail =
                    anime.thumbnail_url ||
                    "https://via.placeholder.com/300x450?text=No+Image";


                const status =
                    anime.status ||
                    "Ongoing";


                return `

                    <div
                        class="card"
                        onclick="
                            openAnime(
                                '${escapeId(animeId)}'
                            )
                        "
                    >

                        <img
                            src="${escapeHtml(thumbnail)}"
                            alt="${escapeHtml(title)}"

                            onerror="
                                this.src=
                                'https://via.placeholder.com/300x450?text=No+Image'
                            "
                        >


                        <div class="card-info">

                            <div class="card-title">

                                ${escapeHtml(title)}

                            </div>


                            <div class="card-status">

                                ${escapeHtml(status)}

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");


    displayPopular(
        animeList
    );

}


/* =====================================
   OPEN ANIME
===================================== */

function openAnime(
    id
){

    if(!id){

        alert(
            "Anime ID available nahi hai."
        );

        return;

    }


    window.location.href =
        "anime-details.html?id=" +
        encodeURIComponent(id);

}


/* =====================================
   SEARCH
===================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function(){

            const search =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allAnime.filter(
                    anime => {

                        const title =
                            anime.title ||
                            "";


                        return title
                            .toLowerCase()
                            .includes(
                                search
                            );

                    }
                );


            displayAnime(
                filtered
            );

        }
    );


/* =====================================
   POPULAR
===================================== */

function displayPopular(
    animeList
){

    const popularGrid =
        document.getElementById(
            "popularGrid"
        );


    const popular =
        animeList.slice(
            0,
            6
        );


    if(
        popular.length === 0
    ){

        popularGrid.innerHTML =
            "";

        return;

    }


    popularGrid.innerHTML =
        popular.map(
            anime => {

                const title =
                    anime.title ||
                    "Unknown Anime";


                const animeId =
                    anime.anime_id ||
                    "";


                const thumbnail =
                    anime.thumbnail_url ||
                    "https://via.placeholder.com/300x450?text=No+Image";


                return `

                    <div
                        class="card"
                        onclick="
                            openAnime(
                                '${escapeId(animeId)}'
                            )
                        "
                    >

                        <img
                            src="${escapeHtml(thumbnail)}"
                            alt="${escapeHtml(title)}"

                            onerror="
                                this.src=
                                'https://via.placeholder.com/300x450?text=No+Image'
                            "
                        >


                        <div class="card-info">

                            <div class="card-title">

                                ${escapeHtml(title)}

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   ESCAPE ID
===================================== */

function escapeId(
    value
){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================
   START
===================================== */

loadAnime();

</script>


</body>
</html>
