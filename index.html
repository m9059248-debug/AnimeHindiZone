<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeHindiZone</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* HEADER */

header{
    background:#15151d;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #252532;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#ff3d71;
}

nav{
    display:flex;
    align-items:center;
    gap:18px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#ff3d71;
}

/* HERO */

.hero{
    padding:50px 5%;
    background:
    linear-gradient(
        135deg,
        #181827,
        #0b0b0f
    );
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:#aaa;
}

/* CONTAINER */

.container{
    padding:30px 5%;
}

.section-title{
    font-size:24px;
    margin-bottom:20px;
}

/* SEARCH */

.search-box{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#171720;
    color:#fff;
    margin-bottom:25px;
    font-size:15px;
}

.search-box::placeholder{
    color:#777;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:
    repeat(
        auto-fill,
        minmax(160px,1fr)
    );
    gap:18px;
}

/* CARD */

.card{
    background:#15151d;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    border:1px solid #24242f;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#ff3d71;
    box-shadow:
    0 8px 25px
    rgba(255,61,113,.15);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    background:#20202a;
}

.card-info{
    padding:12px;
}

.card-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}

.card-status{
    color:#ff3d71;
    font-size:12px;
}

/* =========================
   SCHEDULE
========================= */

.schedule-list{
    display:grid;
    gap:12px;
}

.schedule-card{
    background:#15151d;
    border:1px solid #24242f;
    border-radius:10px;
    padding:16px;
    transition:.25s;
    cursor:pointer;
}

.schedule-card:hover{
    border-color:#ff3d71;
    transform:translateY(-2px);
}

.schedule-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
}

.schedule-anime{
    font-size:18px;
    font-weight:bold;
}

.schedule-episode{
    color:#bbb;
    font-size:14px;
    margin-bottom:8px;
}

.schedule-time{
    color:#aaa;
    font-size:13px;
}

.schedule-status{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}

.status-upcoming{
    color:#7dd3fc;
    background:#102a38;
}

.status-released{
    color:#86efac;
    background:#102c1b;
}

.schedule-loading{
    text-align:center;
    color:#aaa;
    padding:30px;
}

.schedule-empty{
    text-align:center;
    color:#aaa;
    padding:30px;
    background:#15151d;
    border-radius:10px;
    border:1px solid #24242f;
}

/* LOADING */

.loading{
    text-align:center;
    color:#aaa;
    padding:35px;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#aaa;
    padding:35px;
}

/* ERROR */

.error-box{
    background:#241116;
    border:1px solid #ff3d71;
    border-radius:8px;
    padding:18px;
    color:#ffb3c5;
    word-break:break-word;
}

/* FOOTER */

footer{
    margin-top:50px;
    padding:25px;
    text-align:center;
    background:#15151d;
    color:#888;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:15px 4%;
    }

    .logo{
        font-size:20px;
    }

    nav{
        gap:10px;
    }

    nav a{
        font-size:11px;
    }

    .hero{
        padding:40px 5%;
    }

    .hero h1{
        font-size:27px;
    }

    .grid{
        grid-template-columns:
        repeat(2,1fr);

        gap:12px;
    }

    .card img{
        height:220px;
    }

    .schedule-top{
        align-items:flex-start;
    }

    .schedule-anime{
        font-size:16px;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        AnimeHindiZone
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="#latest">
            Latest
        </a>

        <a href="#popular">
            Popular
        </a>

        <a href="#schedule">
            Schedule
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Watch Anime in Hindi
    </h1>

    <p>
        Latest anime, episodes and more.
    </p>

</section>


<!-- =========================
     LATEST ANIME
========================= -->

<div class="container">

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search anime..."
    >

    <h2
        class="section-title"
        id="latest"
    >
        Latest Anime
    </h2>

    <div
        id="animeGrid"
        class="grid"
    >

        <div class="loading">
            Loading anime...
        </div>

    </div>

</div>


<!-- =========================
     POPULAR
========================= -->

<div
    class="container"
    id="popular"
>

    <h2 class="section-title">
        Popular Anime
    </h2>

    <div
        id="popularGrid"
        class="grid"
    >

    </div>

</div>


<!-- =========================
     SCHEDULE
========================= -->

<div
    class="container"
    id="schedule"
>

    <h2 class="section-title">
        📅 Anime Schedule
    </h2>

    <div
        id="scheduleContainer"
        class="schedule-list"
    >

        <div class="schedule-loading">
            Loading schedule...
        </div>

    </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 AnimeHindiZone

</footer>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";


/* =====================================
   GLOBAL DATA
===================================== */

let allAnime = [];


/* =====================================
   LOAD ANIME
===================================== */

async function loadAnime(){

    const grid =
        document.getElementById(
            "animeGrid"
        );

    grid.innerHTML = `

        <div class="loading">
            Loading anime...
        </div>

    `;

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/anime" +
            "?select=id,anime_id,title,thumbnail_url,banner_url,description,genre,season,language,status" +
            "&order=id.desc";

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    }
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "Supabase HTTP " +
                response.status +
                ": " +
                errorText
            );

        }

        const data =
            await response.json();

        console.log(
            "Anime data:",
            data
        );

        allAnime =
            Array.isArray(data)
            ? data
            : [];

        displayAnime(
            allAnime
        );

    }

    catch(error){

        console.error(
            "Anime loading error:",
            error
        );

        grid.innerHTML = `

            <div class="error-box">

                <strong>
                    Anime load nahi ho pa raha.
                </strong>

                <br><br>

                Error:
                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================
   DISPLAY ANIME
===================================== */

function displayAnime(
    animeList
){

    const grid =
        document.getElementById(
            "animeGrid"
        );

    if(
        !animeList ||
        animeList.length === 0
    ){

        grid.innerHTML = `

            <div class="empty">

                Abhi koi anime add nahi hua.

            </div>

        `;

        document
            .getElementById(
                "popularGrid"
            )
            .innerHTML = "";

        return;

    }

    grid.innerHTML =
        animeList.map(
            anime => {

                const title =
                    anime.title ||
                    "Unknown Anime";

                const animeId =
                    anime.anime_id ||
                    "";

                const thumbnail =
                    anime.thumbnail_url ||
                    "https://via.placeholder.com/300x450?text=No+Image";

                const status =
                    anime.status ||
                    "Ongoing";

                return `

                    <div
                        class="card"
                        onclick="
                            openAnime(
                                '${escapeId(animeId)}'
                            )
                        "
                    >

                        <img
                            src="${escapeHtml(thumbnail)}"
                            alt="${escapeHtml(title)}"

                            onerror="
                                this.src=
                                'https://via.placeholder.com/300x450?text=No+Image'
                            "
                        >

                        <div class="card-info">

                            <div class="card-title">

                                ${escapeHtml(title)}

                            </div>

                            <div class="card-status">

                                ${escapeHtml(status)}

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");

    displayPopular(
        animeList
    );

}


/* =====================================
   OPEN ANIME
===================================== */

function openAnime(
    id
){

    if(!id){

        alert(
            "Anime ID available nahi hai."
        );

        return;

    }

    window.location.href =
        "anime-details.html?id=" +
        encodeURIComponent(id);

}


/* =====================================
   SEARCH
===================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function(){

            const search =
                this.value
                    .toLowerCase()
                    .trim();

            const filtered =
                allAnime.filter(
                    anime => {

                        const title =
                            anime.title ||
                            "";

                        return title
                            .toLowerCase()
                            .includes(
                                search
                            );

                    }
                );

            displayAnime(
                filtered
            );

        }
    );


/* =====================================
   POPULAR
===================================== */

function displayPopular(
    animeList
){

    const popularGrid =
        document.getElementById(
            "popularGrid"
        );

    const popular =
        animeList.slice(
            0,
            6
        );

    if(
        popular.length === 0
    ){

        popularGrid.innerHTML =
            "";

        return;

    }

    popularGrid.innerHTML =
        popular.map(
            anime => {

                const title =
                    anime.title ||
                    "Unknown Anime";

                const animeId =
                    anime.anime_id ||
                    "";

                const thumbnail =
                    anime.thumbnail_url ||
                    "https://via.placeholder.com/300x450?text=No+Image";

                return `

                    <div
                        class="card"
                        onclick="
                            openAnime(
                                '${escapeId(animeId)}'
                            )
                        "
                    >

                        <img
                            src="${escapeHtml(thumbnail)}"
                            alt="${escapeHtml(title)}"

                            onerror="
                                this.src=
                                'https://via.placeholder.com/300x450?text=No+Image'
                            "
                        >

                        <div class="card-info">

                            <div class="card-title">

                                ${escapeHtml(title)}

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");

}


/* =====================================
   LOAD SCHEDULE
===================================== */

async function loadSchedule(){

    const container =
        document.getElementById(
            "scheduleContainer"
        );

    container.innerHTML = `

        <div class="schedule-loading">
            Loading schedule...
        </div>

    `;

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/schedule" +
            "?select=id,anime_id,anime_title,episode_number,episode_title,release_at" +
            "&order=release_at.asc" +
            "&limit=20";

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    }
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "Supabase HTTP " +
                response.status +
                ": " +
                errorText
            );

        }

        const schedules =
            await response.json();

        console.log(
            "Schedule data:",
            schedules
        );

        displaySchedule(
            Array.isArray(schedules)
            ? schedules
            : []
        );

    }

    catch(error){

        console.error(
            "Schedule loading error:",
            error
        );

        container.innerHTML = `

            <div class="error-box">

                <strong>
                    Schedule load nahi ho pa raha.
                </strong>

                <br><br>

                Error:
                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================
   DISPLAY SCHEDULE
===================================== */

function displaySchedule(
    schedules
){

    const container =
        document.getElementById(
            "scheduleContainer"
        );

    if(
        !schedules ||
        schedules.length === 0
    ){

        container.innerHTML = `

            <div class="schedule-empty">

                📅 Abhi koi anime schedule available nahi hai.

            </div>

        `;

        return;

    }

    const now =
        new Date();

    container.innerHTML =
        schedules.map(
            schedule => {

                const releaseDate =
                    new Date(
                        schedule.release_at
                    );

                const isReleased =
                    releaseDate <= now;

                const statusText =
                    isReleased
                    ? "Released"
                    : "Upcoming";

                const statusClass =
                    isReleased
                    ? "status-released"
                    : "status-upcoming";

                const animeTitle =
                    schedule.anime_title ||
                    "Unknown Anime";

                const episodeNumber =
                    schedule.episode_number;

                const episodeTitle =
                    schedule.episode_title ||
                    "Episode " +
                    episodeNumber;

                const animeId =
                    schedule.anime_id ||
                    "";

                return `

                    <div
                        class="schedule-card"
                        onclick="
                            openAnime(
                                '${escapeId(animeId)}'
                            )
                        "
                    >

                        <div class="schedule-top">

                            <div class="schedule-anime">

                                ${escapeHtml(
                                    animeTitle
                                )}

                            </div>

                            <span
                                class="
                                    schedule-status
                                    ${statusClass}
                                "
                            >

                                ${statusText}

                            </span>

                        </div>


                        <div class="schedule-episode">

                            Episode
                            ${escapeHtml(
                                episodeNumber
                            )}

                            -
                            ${escapeHtml(
                                episodeTitle
                            )}

                        </div>


                        <div class="schedule-time">

                            🕒
                            ${formatDateTime(
                                schedule.release_at
                            )}

                        </div>

                    </div>

                `;

            }

        ).join("");

}


/* =====================================
   FORMAT INDIA DATE/TIME
===================================== */

function formatDateTime(
    value
){

    const date =
        new Date(value);

    if(
        isNaN(
            date.getTime()
        )
    ){

        return "Invalid date";

    }

    return date.toLocaleString(
        "en-IN",
        {
            dateStyle:"medium",
            timeStyle:"short",
            timeZone:"Asia/Kolkata"
        }
    );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   ESCAPE ID
===================================== */

function escapeId(
    value
){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================
   START
===================================== */

loadAnime();

loadSchedule();

</script>

</body>
</html>
