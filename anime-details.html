<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Details - AnimeHindiZone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
}

header{
  background:#111118;
  border-bottom:1px solid #292936;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#ff1744;
  font-size:22px;
  font-weight:bold;
  text-decoration:none;
}

.nav a{
  color:#fff;
  text-decoration:none;
  margin-left:15px;
}

.nav a:hover{
  color:#ff1744;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.hero{
  min-height:300px;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  background:#15151d;
  margin-bottom:20px;
}

.hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.28;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    #0b0b0f 5%,
    rgba(11,11,15,.55),
    transparent
  );
}

.hero-content{
  position:relative;
  z-index:2;
  min-height:300px;
  display:flex;
  align-items:flex-end;
  gap:20px;
  padding:25px;
}

.poster{
  width:150px;
  height:215px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
  border:2px solid #292936;
}

.info{
  flex:1;
}

.info h1{
  font-size:32px;
  margin-bottom:10px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}

.tag{
  background:#ff1744;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.meta{
  color:#bbb;
  font-size:14px;
  margin:5px 0;
}

.description{
  color:#ccc;
  line-height:1.6;
  margin-top:12px;
}


/* =========================
   SHARE BOX
========================= */

.share-box{
  background:#14141c;
  border:1px solid #292936;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.share-title{
  color:#ff1744;
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.share-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.share-btn{
  border:none;
  cursor:pointer;
  text-decoration:none;
  color:#fff;
  padding:10px 14px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.share-main{
  background:#ff1744;
}

.share-main:hover{
  background:#e9143d;
}

.copy-btn{
  background:#33333f;
}

.copy-btn:hover{
  background:#41414d;
}

.whatsapp-btn{
  background:#25D366;
}

.whatsapp-btn:hover{
  background:#1ebc59;
}

.telegram-btn{
  background:#229ED9;
}

.telegram-btn:hover{
  background:#1689bf;
}

.share-message{
  color:#8affaa;
  font-size:13px;
  margin-top:10px;
  display:none;
}


/* =========================
   SECTIONS
========================= */

.section{
  background:#14141c;
  border:1px solid #292936;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

.section h2{
  color:#ff1744;
  margin-bottom:15px;
}

.episodes{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
}

.episode{
  background:#0e0e15;
  border:1px solid #292936;
  border-radius:9px;
  padding:15px;
  transition:.2s;
}

.episode:hover{
  border-color:#ff1744;
  transform:translateY(-2px);
}

.episode-number{
  font-weight:bold;
  margin-bottom:6px;
}

.episode-title{
  color:#aaa;
  font-size:13px;
  margin-bottom:12px;
  min-height:32px;
}

.watch{
  display:inline-block;
  background:#ff1744;
  color:#fff;
  text-decoration:none;
  padding:8px 12px;
  border-radius:6px;
  font-size:13px;
  font-weight:bold;
}

.watch:hover{
  background:#e9143d;
}

.loading,
.error,
.empty{
  text-align:center;
  color:#999;
  padding:30px 10px;
}

.error{
  color:#ff6b81;
}

.back{
  display:inline-block;
  margin-bottom:15px;
  color:#ff1744;
  text-decoration:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .nav{
    flex-direction:column;
    gap:10px;
  }

  .nav a{
    margin-left:8px;
    margin-right:8px;
  }

  .hero-content{
    align-items:flex-end;
    padding:15px;
  }

  .poster{
    width:100px;
    height:145px;
  }

  .info h1{
    font-size:23px;
  }

  .description{
    font-size:13px;
  }

  .share-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .share-btn{
    width:100%;
  }

}

</style>
</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="nav">

    <a
      href="index.html"
      class="logo"
    >
      🔥 AnimeHindiZone
    </a>

    <div>

      <a href="index.html">
        Home
      </a>

      <a href="admin.html">
        Admin
      </a>

    </div>

  </div>

</header>


<div class="container">


<!-- =========================
     BACK
========================= -->

<a
  href="index.html"
  class="back"
>
  ← Back to Home
</a>


<!-- =========================
     ANIME DETAILS
========================= -->

<div id="animeContainer">

  <div class="loading">
    Anime details load ho rahe hain...
  </div>

</div>


<!-- =========================
     SHARE ANIME
========================= -->

<div class="share-box">

  <div class="share-title">
    📤 Share Anime
  </div>

  <div class="share-buttons">

    <button
      class="share-btn share-main"
      onclick="shareAnime()"
    >
      📤 Share
    </button>


    <button
      class="share-btn copy-btn"
      onclick="copyAnimeLink()"
    >
      📋 Copy Link
    </button>


    <a
      id="whatsappShare"
      class="share-btn whatsapp-btn"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >
      🟢 WhatsApp
    </a>


    <a
      id="telegramShare"
      class="share-btn telegram-btn"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >
      ✈️ Telegram
    </a>

  </div>


  <div
    id="shareMessage"
    class="share-message"
  >
    Link copied successfully!
  </div>

</div>


<!-- =========================
     EPISODES
========================= -->

<div class="section">

  <h2>
    📺 Episodes
  </h2>

  <div
    id="episodeContainer"
    class="episodes"
  >

    <div class="loading">
      Episodes load ho rahe hain...
    </div>

  </div>

</div>


</div>


<script>


// ==========================
// SUPABASE
// ==========================

const SUPABASE_URL =
"https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ==========================
// GET ANIME ID
// ==========================

const params =
new URLSearchParams(
  window.location.search
);

const animeId =
params.get("id");


// ==========================
// ELEMENTS
// ==========================

const animeContainer =
document.getElementById(
  "animeContainer"
);

const episodeContainer =
document.getElementById(
  "episodeContainer"
);

const shareMessage =
document.getElementById(
  "shareMessage"
);

const whatsappShare =
document.getElementById(
  "whatsappShare"
);

const telegramShare =
document.getElementById(
  "telegramShare"
);


// ==========================
// ESCAPE HTML
// ==========================

function escapeHtml(value){

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================
// SHARE LINK
// ==========================

function getAnimeShareLink(){

  return window.location.href;

}


// ==========================
// UPDATE SHARE LINKS
// ==========================

function updateShareLinks(){

  const shareUrl =
    getAnimeShareLink();

  const shareText =
    "Watch " +
    (
      document.title ||
      "Anime"
    ) +
    " on AnimeHindiZone";


  whatsappShare.href =
    "https://wa.me/?text=" +
    encodeURIComponent(
      shareText +
      "\n\n" +
      shareUrl
    );


  telegramShare.href =
    "https://t.me/share/url?url=" +
    encodeURIComponent(
      shareUrl
    ) +
    "&text=" +
    encodeURIComponent(
      shareText
    );

}


// ==========================
// NATIVE SHARE
// ==========================

async function shareAnime(){

  const shareUrl =
    getAnimeShareLink();

  const shareTitle =
    document.title ||
    "AnimeHindiZone";

  const shareText =
    "Watch this anime on AnimeHindiZone";


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          shareTitle,

        text:
          shareText,

        url:
          shareUrl

      });

    }
    catch(error){

      console.log(
        "Share cancelled:",
        error
      );

    }

  }
  else{

    copyAnimeLink();

  }

}


// ==========================
// COPY LINK
// ==========================

async function copyAnimeLink(){

  const shareUrl =
    getAnimeShareLink();


  try{

    await navigator.clipboard.writeText(
      shareUrl
    );

    showShareMessage(
      "✅ Anime link copied!"
    );

  }
  catch(error){

    // Fallback
    const textArea =
      document.createElement(
        "textarea"
      );

    textArea.value =
      shareUrl;

    document.body.appendChild(
      textArea
    );

    textArea.select();

    document.execCommand(
      "copy"
    );

    textArea.remove();

    showShareMessage(
      "✅ Anime link copied!"
    );

  }

}


// ==========================
// SHARE MESSAGE
// ==========================

function showShareMessage(message){

  shareMessage.innerText =
    message;

  shareMessage.style.display =
    "block";


  setTimeout(
    function(){

      shareMessage.style.display =
        "none";

    },
    2500
  );

}


// ==========================
// LOAD ANIME
// ==========================

async function loadAnime(){

  if(!animeId){

    animeContainer.innerHTML =
      `
      <div class="error">
        ❌ Anime ID nahi mila.
      </div>
      `;

    episodeContainer.innerHTML =
      `
      <div class="empty">
        Anime select karo.
      </div>
      `;

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("anime")
      .select("*")
      .eq(
        "anime_id",
        animeId
      )
      .maybeSingle();


  if(error){

    animeContainer.innerHTML =
      `
      <div class="error">
        ❌ Anime load failed:
        ${escapeHtml(
          error.message
        )}
      </div>
      `;

    return;

  }


  if(!data){

    animeContainer.innerHTML =
      `
      <div class="error">
        ❌ Anime nahi mila.
      </div>
      `;

    episodeContainer.innerHTML =
      `
      <div class="empty">
        Is anime ke liye koi data available nahi hai.
      </div>
      `;

    return;

  }


  renderAnime(data);

  loadEpisodes(
    data.anime_id
  );

}


// ==========================
// RENDER ANIME
// ==========================

function renderAnime(anime){

  const genres =
    anime.genre
      ? anime.genre
          .split(",")
          .map(
            g =>
              g.trim()
          )
          .filter(Boolean)
      : [];


  let tags = "";


  genres.forEach(
    genre => {

      tags +=
        `
        <span class="tag">
          ${escapeHtml(
            genre
          )}
        </span>
        `;

    }
  );


  if(anime.language){

    tags +=
      `
      <span class="tag">
        ${escapeHtml(
          anime.language
        )}
      </span>
      `;

  }


  if(anime.status){

    tags +=
      `
      <span class="tag">
        ${escapeHtml(
          anime.status
        )}
      </span>
      `;

  }


  document.title =
    (
      anime.title ||
      "Anime"
    ) +
    " - AnimeHindiZone";


  animeContainer.innerHTML =

    `
    <div class="hero">

      ${
        anime.banner_url
        ?
        `
        <img
          class="hero-bg"
          src="${escapeHtml(
            anime.banner_url
          )}"
          alt=""
        >
        `
        :
        ""
      }


      <div class="hero-overlay"></div>


      <div class="hero-content">


        ${
          anime.thumbnail_url
          ?
          `
          <img
            class="poster"
            src="${escapeHtml(
              anime.thumbnail_url
            )}"
            alt="${escapeHtml(
              anime.title
            )}"
            onerror="this.style.display='none'"
          >
          `
          :
          ""
        }


        <div class="info">

          <h1>
            ${escapeHtml(
              anime.title
            )}
          </h1>


          <div class="tags">

            ${tags}

          </div>


          ${
            anime.season
            ?
            `
            <div class="meta">
              📅 Season:
              ${escapeHtml(
                anime.season
              )}
            </div>
            `
            :
            ""
          }


          <div class="description">

            ${escapeHtml(
              anime.description ||
              "Is anime ki description available nahi hai."
            )}

          </div>

        </div>

      </div>

    </div>
    `;


  // Share links update
  updateShareLinks();

}


// ==========================
// LOAD EPISODES
// ==========================

async function loadEpisodes(animeId){

  episodeContainer.innerHTML =
    `
    <div class="loading">
      Episodes load ho rahe hain...
    </div>
    `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("episodes")
      .select("*")
      .eq(
        "anime_id",
        animeId
      )
      .order(
        "episode_number",
        {
          ascending:true
        }
      );


  if(error){

    episodeContainer.innerHTML =
      `
      <div class="error">
        ❌ Episodes load failed:
        ${escapeHtml(
          error.message
        )}
      </div>
      `;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    episodeContainer.innerHTML =
      `
      <div class="empty">
        📺 Abhi koi episode available nahi hai.
      </div>
      `;

    return;

  }


  episodeContainer.innerHTML =
    "";


  data.forEach(
    episode => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "episode";


      div.innerHTML =

        `
        <div class="episode-number">

          Episode
          ${escapeHtml(
            String(
              episode.episode_number
            )
          )}

        </div>


        <div class="episode-title">

          ${escapeHtml(
            episode.episode_title ||
            "Episode " +
            episode.episode_number
          )}

        </div>


        <a
          class="watch"
          href="watch.html?id=${encodeURIComponent(
            animeId
          )}&episode=${encodeURIComponent(
            episode.episode_number
          )}"
        >
          ▶ Watch Now
        </a>

        `;


      episodeContainer.appendChild(
        div
      );

    }
  );

}


// ==========================
// START
// ==========================

loadAnime();

</script>

</body>
</html>
