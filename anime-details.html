<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Details - AnimeHindiZone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#09090f;
  color:white;
}

header{
  background:#11111b;
  border-bottom:1px solid #292936;
  padding:18px 6%;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#9b5cff;
}

.back{
  color:#ddd;
  text-decoration:none;
}

.back:hover{
  color:#9b5cff;
}

.container{
  width:88%;
  max-width:1100px;
  margin:50px auto;
}

.details{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:35px;
  background:#11111b;
  border:1px solid #252535;
  border-radius:18px;
  padding:25px;
}

.poster{
  height:390px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;

  background:
    radial-gradient(circle at 30% 20%,#a45cff66,transparent 35%),
    linear-gradient(145deg,#281044,#0d0d15);
}

.poster h2{
  font-size:30px;
}

.info h1{
  font-size:38px;
  margin-bottom:15px;
}

.description{
  color:#b9b9c5;
  line-height:1.7;
  font-size:17px;
  margin:20px 0;
}

.tags{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.tag{
  background:#7135c9;
  padding:7px 12px;
  border-radius:7px;
  font-size:13px;
}

.watch{
  display:inline-block;
  background:#8239f3;
  color:white;
  text-decoration:none;
  padding:14px 25px;
  border-radius:10px;
  font-weight:bold;
}

.episodes{
  margin-top:40px;
}

.episodes h2{
  margin-bottom:20px;
}

.episode-list{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.episode{
  background:#171722;
  border:1px solid #282838;
  padding:15px;
  text-align:center;
  border-radius:9px;
  color:#ddd;
  text-decoration:none;
  display:block;
}

.episode:hover{
  border-color:#9b5cff;
  color:#fff;
}

.loading{
  color:#999;
  padding:20px 0;
}

.error{
  color:#ff6b6b;
  padding:20px 0;
}

footer{
  margin-top:70px;
  padding:30px;
  text-align:center;
  background:#11111b;
  color:#888;
}

@media(max-width:700px){

  .logo{
    font-size:22px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .poster{
    height:350px;
  }

  .info h1{
    font-size:30px;
  }

  .episode-list{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">AnimeHindiZone</div>

    <a class="back" href="index.html">
      ← Home
    </a>
  </div>
</header>


<main class="container">

  <section class="details">

    <div class="poster">
      <h2 id="posterTitle">Loading...</h2>
    </div>


    <div class="info">

      <h1 id="animeTitle">Loading...</h1>


      <div class="tags" id="animeTags"></div>


      <p class="description" id="animeDescription">
        Loading anime information...
      </p>


      <p class="description">

        <b>Episodes:</b>
        <span id="episodeCount">Loading...</span>

        <br>

        <b>Language:</b>
        Hindi / Japanese

        <br>

        <b>Status:</b>
        <span id="animeStatus">Ongoing</span>

      </p>


      <a href="#episodes" class="watch">
        View Episodes
      </a>

    </div>

  </section>


  <section class="episodes" id="episodes">

    <h2>Episodes</h2>

    <div class="episode-list" id="episodeList">

      <div class="loading">
        Loading episodes...
      </div>

    </div>

  </section>

</main>


<footer>
  © 2026 AnimeHindiZone
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   ANIME DATABASE
========================= */

const animeDatabase = {

  "solo-leveling": {

    title: "Solo Leveling",

    genres: [
      "Hindi",
      "Action",
      "Fantasy",
      "Adventure"
    ],

    season: "Season 2",

    status: "Completed",

    description:
      "Solo Leveling is an action fantasy anime following a hunter who grows stronger through mysterious powers and challenging battles."

  },


  "one-piece": {

    title: "One Piece",

    genres: [
      "Hindi",
      "Action",
      "Adventure"
    ],

    season: "Ongoing",

    status: "Ongoing",

    description:
      "One Piece follows Monkey D. Luffy and his crew on their journey across the Grand Line in search of the legendary One Piece treasure."

  },


  "demon-slayer": {

    title: "Demon Slayer",

    genres: [
      "Hindi",
      "Action",
      "Fantasy"
    ],

    season: "Latest Season",

    status: "Ongoing",

    description:
      "Demon Slayer follows Tanjiro Kamado as he joins the Demon Slayer Corps after his family is attacked by demons."

  },


  "jujutsu-kaisen": {

    title: "Jujutsu Kaisen",

    genres: [
      "Hindi",
      "Action",
      "Fantasy"
    ],

    season: "Season 2",

    status: "Ongoing",

    description:
      "Jujutsu Kaisen follows Yuji Itadori as he becomes involved in the dangerous world of cursed spirits and jujutsu sorcerers."

  },


  "naruto": {

    title: "Naruto",

    genres: [
      "Hindi",
      "Action",
      "Adventure"
    ],

    season: "Complete Series",

    status: "Completed",

    description:
      "Naruto follows a young ninja who dreams of becoming the strongest leader of his village."

  },


  "attack-on-titan": {

    title: "Attack on Titan",

    genres: [
      "Hindi",
      "Action",
      "Fantasy"
    ],

    season: "Complete Series",

    status: "Completed",

    description:
      "Attack on Titan follows humanity's struggle for survival against mysterious giant Titans."

  },


  "bleach": {

    title: "Bleach",

    genres: [
      "Hindi",
      "Action",
      "Supernatural"
    ],

    season: "Complete Series",

    status: "Completed",

    description:
      "Bleach follows Ichigo Kurosaki after he gains the powers of a Soul Reaper and becomes involved in supernatural battles."

  },


  "dragon-ball": {

    title: "Dragon Ball",

    genres: [
      "Hindi",
      "Action",
      "Adventure"
    ],

    season: "Complete Series",

    status: "Completed",

    description:
      "Dragon Ball follows Goku and his friends through exciting martial arts battles and adventures."

  }

};


/* =========================
   GET ANIME ID
========================= */

const params =
  new URLSearchParams(window.location.search);

const animeId =
  params.get("id") || "solo-leveling";


/* =========================
   LOAD ANIME INFORMATION
========================= */

function loadAnimeInfo(){

  const anime =
    animeDatabase[animeId];

  if(!anime){

    document.getElementById("animeTitle")
      .textContent = "Anime Not Found";

    document.getElementById("posterTitle")
      .textContent = "Not Found";

    document.getElementById("animeDescription")
      .textContent =
      "This anime is not available.";

    document.getElementById("animeTags")
      .innerHTML = "";

    return;

  }


  document.title =
    anime.title + " - AnimeHindiZone";


  document.getElementById("animeTitle")
    .textContent = anime.title;


  document.getElementById("posterTitle")
    .textContent = anime.title;


  document.getElementById("animeDescription")
    .textContent = anime.description;


  document.getElementById("animeStatus")
    .textContent = anime.status;


  const tags =
    document.getElementById("animeTags");

  tags.innerHTML = "";


  anime.genres.forEach(function(tag){

    const span =
      document.createElement("span");

    span.className = "tag";

    span.textContent = tag;

    tags.appendChild(span);

  });


  const season =
    document.createElement("span");

  season.className = "tag";

  season.textContent = anime.season;

  tags.appendChild(season);

}


/* =========================
   LOAD EPISODES
========================= */

async function loadEpisodes(){

  const episodeList =
    document.getElementById("episodeList");

  const episodeCount =
    document.getElementById("episodeCount");


  const anime =
    animeDatabase[animeId];


  if(!anime){

    episodeList.innerHTML =
      '<div class="error">Anime not found.</div>';

    episodeCount.textContent = "0";

    return;

  }


  const { data, error } =
    await supabaseClient

      .from("episodes")

      .select(
        "episode_number, episode_title"
      )

      .eq("anime_id", animeId)

      .order(
        "episode_number",
        {
          ascending:true
        }
      );


  if(error){

    console.error(error);

    episodeList.innerHTML =
      '<div class="error">Episodes load nahi ho paaye.</div>';

    episodeCount.textContent =
      "Error";

    return;

  }


  episodeList.innerHTML = "";


  if(!data || data.length === 0){

    episodeList.innerHTML =
      '<div class="loading">No episodes available.</div>';

    episodeCount.textContent =
      "0";

    return;

  }


  episodeCount.textContent =
    data.length;


  data.forEach(function(ep){

    const link =
      document.createElement("a");


    link.className =
      "episode";


    /*
      Anime ID bhi watch page ko bhej rahe hain.
    */

    link.href =
      "watch.html?id=" +
      encodeURIComponent(animeId) +
      "&episode=" +
      encodeURIComponent(ep.episode_number);


    link.textContent =
      ep.episode_title ||
      "Episode " +
      ep.episode_number;


    episodeList.appendChild(link);

  });

}


/* =========================
   START
========================= */

loadAnimeInfo();

loadEpisodes();

</script>

</body>
</html>
