<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Episode - AnimeHindiZone</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#09090f;
  color:white;
}

header{
  background:#11111b;
  border-bottom:1px solid #292936;
  padding:18px 6%;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#9b5cff;
}

.back{
  color:#ddd;
  text-decoration:none;
}

.back:hover{
  color:#9b5cff;
}

.container{
  width:90%;
  max-width:1100px;
  margin:40px auto;
}

.title{
  margin-bottom:20px;
}

.title h1{
  font-size:30px;
  margin-bottom:8px;
}

.title p{
  color:#999;
}

.player{
  background:#000;
  border:1px solid #292936;
  border-radius:14px;
  overflow:hidden;
  width:100%;
  aspect-ratio:16/9;
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  color:#aaa;
}

.error{
  padding:30px;
  text-align:center;
  color:#ff6b6b;
}

.notice{
  margin-top:20px;
  padding:18px;
  background:#11111b;
  border:1px solid #292936;
  border-radius:12px;
  color:#aaa;
  line-height:1.6;
}

.episodes{
  margin-top:35px;
}

.episodes h2{
  margin-bottom:18px;
}

.episode-list{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.episode{
  background:#171722;
  border:1px solid #292936;
  color:#ddd;
  padding:14px;
  text-align:center;
  border-radius:9px;
  text-decoration:none;
}

.episode:hover{
  border-color:#9b5cff;
  color:white;
}

.active{
  background:#7135c9;
  border-color:#9b5cff;
}

footer{
  margin-top:70px;
  padding:30px;
  text-align:center;
  background:#11111b;
  color:#888;
}

@media(max-width:700px){

  .logo{
    font-size:22px;
  }

  .container{
    width:94%;
  }

  .title h1{
    font-size:25px;
  }

  .episode-list{
    grid-template-columns:repeat(3,1fr);
  }

  .player{
    aspect-ratio:16/9;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      AnimeHindiZone
    </div>

    <a href="anime-details.html" class="back">
      ← Back
    </a>

  </div>
</header>


<main class="container">

  <div class="title">

    <h1 id="episodeTitle">
      Loading episode...
    </h1>

    <p>
      Season 2 • Hindi
    </p>

  </div>


  <div class="player" id="player">

    <div class="loading">
      Video load ho raha hai...
    </div>

  </div>


  <div class="notice">

    <b>Now Playing</b><br>

    Solo Leveling Episode
    <span id="episodeNumber">-</span>

  </div>


  <section class="episodes">

    <h2>Episodes</h2>

    <div
      class="episode-list"
      id="episodeList"
    >

      <div class="loading">
        Episodes load ho rahe hain...
      </div>

    </div>

  </section>

</main>


<footer>
  © 2026 AnimeHindiZone
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   CURRENT EPISODE
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const episode =
  Number(
    params.get("episode") || "1"
  );


/* =========================
   LOAD EPISODE
========================= */

async function loadEpisode(){

  const title =
    document.getElementById("episodeTitle");

  const number =
    document.getElementById("episodeNumber");

  const player =
    document.getElementById("player");


  number.textContent =
    episode;


  title.textContent =
    "Solo Leveling - Episode " +
    episode;


  const {
    data,
    error
  } =
  await supabaseClient
  .from("episodes")
  .select(
    "episode_number, episode_title, video_url"
  )
  .eq("anime_id","solo-leveling")
  .eq("episode_number",episode)
  .limit(1);


  if(error){

    console.error(error);

    player.innerHTML =
      '<div class="error">' +
      'Video load nahi ho paya.' +
      '</div>';

    return;
  }


  if(!data || data.length === 0){

    player.innerHTML =
      '<div class="error">' +
      'Is episode ka video abhi available nahi hai.' +
      '</div>';

    return;
  }


  const episodeData =
    data[0];


  title.textContent =
    "Solo Leveling - " +
    (
      episodeData.episode_title ||
      "Episode " + episode
    );


  if(!episodeData.video_url){

    player.innerHTML =
      '<div class="error">' +
      'Is episode ka video URL available nahi hai.' +
      '</div>';

    return;
  }


  /*
    URL ko iframe me load kar rahe hain.
    Sirf wahi video URL use karein jise
    aapko embed/stream karne ki permission ho.
  */

  const iframe =
    document.createElement("iframe");


  iframe.src =
    episodeData.video_url;

  iframe.allowFullscreen = true;

  iframe.setAttribute(
    "allow",
    "autoplay; fullscreen"
  );


  player.innerHTML = "";

  player.appendChild(iframe);

}


/* =========================
   LOAD EPISODE LIST
========================= */

async function loadEpisodeList(){

  const list =
    document.getElementById("episodeList");


  const {
    data,
    error
  } =
  await supabaseClient
  .from("episodes")
  .select(
    "episode_number, episode_title"
  )
  .eq("anime_id","solo-leveling")
  .order(
    "episode_number",
    {ascending:true}
  );


  if(error){

    console.error(error);

    list.innerHTML =
      '<div class="error">' +
      'Episodes load nahi ho paaye.' +
      '</div>';

    return;
  }


  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="loading">' +
      'Abhi koi episode available nahi hai.' +
      '</div>';

    return;
  }


  list.innerHTML = "";


  data.forEach(function(ep){

    const link =
      document.createElement("a");


    link.className =
      "episode";


    link.href =
      "watch.html?episode=" +
      encodeURIComponent(
        ep.episode_number
      );


    link.textContent =
      ep.episode_title ||
      "Episode " +
      ep.episode_number;


    if(
      Number(ep.episode_number) ===
      episode
    ){

      link.classList.add("active");

    }


    list.appendChild(link);

  });

}


/* =========================
   START
========================= */

loadEpisode();

loadEpisodeList();

</script>

</body>
</html>
