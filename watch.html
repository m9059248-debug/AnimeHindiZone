<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Watch Anime - AnimeHindiZone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
}

header{
  background:#111118;
  border-bottom:1px solid #292936;
  padding:16px 20px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#ff1744;
  text-decoration:none;
  font-size:22px;
  font-weight:bold;
}

.nav a{
  color:#fff;
  text-decoration:none;
  margin-left:15px;
}

.nav a:hover{
  color:#ff1744;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.back{
  display:inline-block;
  color:#ff1744;
  text-decoration:none;
  margin-bottom:15px;
}

.video-box{
  background:#14141c;
  border:1px solid #292936;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:20px;
}

.video-wrapper{
  width:100%;
  background:#000;
  aspect-ratio:16/9;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

.info{
  padding:18px;
}

.info h1{
  color:#fff;
  font-size:24px;
  margin-bottom:8px;
}

.meta{
  color:#aaa;
  font-size:14px;
}

.message{
  text-align:center;
  padding:40px 15px;
  color:#aaa;
}

.error{
  color:#ff6b81;
}

.episode-nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.episode-nav a{
  display:inline-block;
  background:#22222c;
  color:#fff;
  text-decoration:none;
  padding:9px 13px;
  border-radius:7px;
  font-size:13px;
}

.episode-nav a.active{
  background:#ff1744;
}

.episode-nav a:hover{
  background:#ff1744;
}

.section{
  background:#14141c;
  border:1px solid #292936;
  border-radius:12px;
  padding:20px;
}

.section h2{
  color:#ff1744;
  margin-bottom:15px;
}

.view-info{
  margin-top:12px;
  color:#888;
  font-size:13px;
}

@media(max-width:600px){

  .info h1{
    font-size:20px;
  }

  .nav{
    flex-direction:column;
    gap:10px;
  }

  .nav a{
    margin-left:8px;
  }

}

</style>

</head>

<body>


<header>

  <div class="nav">

    <a
      href="index.html"
      class="logo"
    >
      🔥 AnimeHindiZone
    </a>

    <div>

      <a href="index.html">
        Home
      </a>

      <a href="admin.html">
        Admin
      </a>

    </div>

  </div>

</header>


<div class="container">


<a
  href="index.html"
  class="back"
>
  ← Home
</a>


<!-- VIDEO -->

<div class="video-box">

  <div
    id="videoContainer"
    class="video-wrapper"
  >

    <div class="message">
      Video load ho raha hai...
    </div>

  </div>


  <div class="info">

    <h1 id="episodeTitle">
      Loading...
    </h1>

    <div
      id="episodeMeta"
      class="meta"
    ></div>

    <div
      id="viewInfo"
      class="view-info"
    ></div>

  </div>

</div>


<!-- EPISODE NAVIGATION -->

<div class="section">

  <h2>
    📺 Episodes
  </h2>

  <div
    id="episodeNav"
    class="episode-nav"
  >

    <div class="message">
      Episodes load ho rahe hain...
    </div>

  </div>

</div>


</div>


<script>


// =================================
// SUPABASE
// =================================

const SUPABASE_URL =
"https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// =================================
// URL PARAMETERS
// =================================

const params =
new URLSearchParams(
  window.location.search
);

const animeId =
params.get("id");

const episodeNumber =
params.get("episode");


// =================================
// ELEMENTS
// =================================

const videoContainer =
document.getElementById(
  "videoContainer"
);

const episodeTitle =
document.getElementById(
  "episodeTitle"
);

const episodeMeta =
document.getElementById(
  "episodeMeta"
);

const episodeNav =
document.getElementById(
  "episodeNav"
);

const viewInfo =
document.getElementById(
  "viewInfo"
);


// =================================
// ESCAPE HTML
// =================================

function escapeHtml(value){

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// =================================
// RECORD ANIME VIEW
// =================================

async function recordAnimeView(){

  if(!animeId){

    return;

  }


  try{

    const {
      data: {
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if(!user){

      console.log(
        "User login nahi hai."
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from(
          "anime_views"
        )
        .insert({

          anime_id:
            animeId,

          user_id:
            user.id

        });


    if(error){

      /*
        Agar same user ne
        same anime pehle hi dekha hai,
        to duplicate error ko ignore karenge.
      */

      if(
        error.code === "23505"
      ){

        viewInfo.textContent =
          "👁️ Already viewed";

        return;

      }


      console.error(
        "View save failed:",
        error
      );

      viewInfo.textContent =
        "👁️ View tracking unavailable";

      return;

    }


    viewInfo.textContent =
      "👁️ View counted";

  }

  catch(error){

    console.error(
      "View tracking error:",
      error
    );

  }

}


// =================================
// LOAD CURRENT EPISODE
// =================================

async function loadEpisode(){

  if(!animeId || !episodeNumber){

    videoContainer.innerHTML =
      `
      <div class="message error">
        ❌ Anime ID ya Episode number missing hai.
      </div>
      `;

    episodeTitle.textContent =
      "Episode unavailable";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("episodes")
      .select("*")
      .eq(
        "anime_id",
        animeId
      )
      .eq(
        "episode_number",
        Number(
          episodeNumber
        )
      )
      .maybeSingle();


  if(error){

    videoContainer.innerHTML =
      `
      <div class="message error">
        ❌ Video load failed:
        ${escapeHtml(
          error.message
        )}
      </div>
      `;

    return;

  }


  if(!data){

    videoContainer.innerHTML =
      `
      <div class="message error">
        ❌ Ye episode nahi mila.
      </div>
      `;

    return;

  }


  episodeTitle.textContent =
    data.episode_title ||
    "Episode " +
    data.episode_number;


  episodeMeta.textContent =
    (data.anime_title || animeId) +
    " • Episode " +
    data.episode_number;


  document.title =
    (data.anime_title || "Anime") +
    " - Episode " +
    data.episode_number;


  // VIDEO LOAD

  loadVideo(
    data.video_url
  );


  // VIEW RECORD

  recordAnimeView();

}


// =================================
// LOAD VIDEO
// =================================

function loadVideo(url){

  if(!url){

    videoContainer.innerHTML =
      `
      <div class="message error">
        ❌ Is episode ka video URL available nahi hai.
      </div>
      `;

    return;

  }


  const lowerUrl =
    url.toLowerCase();


  const isVideoFile =
    lowerUrl.includes(".mp4") ||
    lowerUrl.includes(".webm") ||
    lowerUrl.includes(".ogg") ||
    lowerUrl.includes(".m3u8");


  if(isVideoFile){

    const video =
      document.createElement(
        "video"
      );


    video.controls =
      true;


    video.playsInline =
      true;


    video.preload =
      "metadata";


    video.src =
      url;


    video.addEventListener(
      "error",
      function(){

        videoContainer.innerHTML =
          `
          <div class="message error">
            ❌ Video play nahi ho saka.
          </div>
          `;

      }
    );


    videoContainer.innerHTML =
      "";


    videoContainer.appendChild(
      video
    );


    return;

  }


  // =================================
  // IFRAME / EMBED VIDEO
  // =================================

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.src =
    url;


  iframe.allowFullscreen =
    true;


  iframe.setAttribute(
    "allow",
    "autoplay; fullscreen; picture-in-picture"
  );


  videoContainer.innerHTML =
    "";


  videoContainer.appendChild(
    iframe
  );

}


// =================================
// LOAD EPISODE LIST
// =================================

async function loadEpisodeList(){

  if(!animeId){

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("episodes")
      .select(
        "episode_number,episode_title"
      )
      .eq(
        "anime_id",
        animeId
      )
      .order(
        "episode_number",
        {
          ascending:
            true
        }
      );


  if(error){

    episodeNav.innerHTML =
      `
      <div class="message error">
        ❌ Episodes load failed.
      </div>
      `;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    episodeNav.innerHTML =
      `
      <div class="message">
        Abhi koi episode available nahi hai.
      </div>
      `;

    return;

  }


  episodeNav.innerHTML =
    "";


  data.forEach(
    episode => {

      const link =
        document.createElement(
          "a"
        );


      link.href =
        "watch.html?id=" +
        encodeURIComponent(
          animeId
        ) +
        "&episode=" +
        encodeURIComponent(
          episode.episode_number
        );


      link.textContent =
        "Episode " +
        episode.episode_number;


      if(
        Number(
          episode.episode_number
        ) ===
        Number(
          episodeNumber
        )
      ){

        link.classList.add(
          "active"
        );

      }


      episodeNav.appendChild(
        link
      );

    }
  );

}


// =================================
// START
// =================================

loadEpisode();

loadEpisodeList();

</script>

</body>
</html>
