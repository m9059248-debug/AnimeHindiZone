<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeHindiZone Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
}

header{
  background:#111118;
  padding:18px;
  border-bottom:1px solid #292936;
}

header h1{
  color:#ff1744;
  font-size:24px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.box{
  background:#14141c;
  border:1px solid #292936;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

h2{
  margin-bottom:15px;
  color:#ff1744;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:7px 0;
  background:#0d0d13;
  border:1px solid #333340;
  border-radius:8px;
  color:#fff;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:none;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#ff1744;
  color:white;
}

.primary:hover{
  background:#e9143d;
}

.delete-btn{
  background:#d50000;
  color:white;
  margin-top:10px;
}

.delete-btn:hover{
  background:#ff1744;
}

.login{
  max-width:420px;
  margin:80px auto;
  padding:20px;
}

.message{
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  display:none;
}

.message.success{
  display:block;
  background:#123b20;
  color:#6dff91;
}

.message.error{
  display:block;
  background:#40131b;
  color:#ff7d91;
}

.anime-item{
  background:#0e0e15;
  border:1px solid #292936;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
}

.anime-item:hover{
  border-color:#ff1744;
}

.anime-thumb{
  width:70px;
  height:90px;
  object-fit:cover;
  border-radius:7px;
  background:#222;
}

.anime-info{
  flex:1;
}

.anime-info h3{
  margin-bottom:6px;
}

.small{
  color:#999;
  font-size:13px;
}

.status{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  background:#252530;
  border-radius:5px;
  font-size:12px;
}

.library-actions{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.episode-item{
  background:#0e0e15;
  border:1px solid #292936;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
}

.episode-item a{
  color:#ff1744;
  word-break:break-all;
}

.empty{
  color:#888;
  padding:15px;
  text-align:center;
}

.hidden{
  display:none;
}

.logout{
  float:right;
  background:#33333f;
  color:white;
}

.logout:hover{
  background:#444452;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login">

  <div class="box">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="loginAdmin()"
    >
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="hidden">

<header>

  <button
    class="logout"
    onclick="logoutAdmin()"
  >
    Logout
  </button>

  <h1>🔥 AnimeHindiZone Admin</h1>

</header>


<div class="container">


<!-- ADD ANIME -->

<div class="box">

<h2>➕ Add New Anime</h2>

<input
  id="animeId"
  placeholder="Anime ID e.g. blacktorch"
>

<input
  id="animeTitle"
  placeholder="Anime Name"
>

<input
  id="thumbnail"
  placeholder="Thumbnail URL"
>

<input
  id="banner"
  placeholder="Banner URL"
>

<textarea
  id="description"
  placeholder="Anime Description"
></textarea>

<input
  id="genre"
  placeholder="Genre e.g. Action, Fantasy"
>

<input
  id="season"
  placeholder="Season e.g. Season 1"
>

<input
  id="language"
  placeholder="Language e.g. Hindi"
  value="Hindi"
>

<select id="status">

  <option value="Ongoing">
    Ongoing
  </option>

  <option value="Completed">
    Completed
  </option>

</select>

<button
  class="primary"
  onclick="addAnime()"
>
  Add Anime
</button>

<div
  id="animeMessage"
  class="message"
></div>

</div>


<!-- ANIME LIBRARY -->

<div class="box">

<h2>📚 Anime Library</h2>

<input
  id="animeSearch"
  placeholder="🔎 Search anime..."
>

<div id="animeLibrary">

  <div class="empty">
    Anime load ho rahe hain...
  </div>

</div>

</div>


<!-- SELECTED ANIME -->

<div
  id="animeDetails"
  class="box"
  style="display:none;"
>

<h2>🎬 Selected Anime</h2>

<div id="selectedAnimeInfo"></div>

</div>


<!-- ADD EPISODE -->

<div
  id="episodeForm"
  class="box"
  style="display:none;"
>

<h2>➕ Add Episode</h2>

<input
  id="episodeNumber"
  type="number"
  placeholder="Episode Number"
>

<input
  id="episodeTitle"
  placeholder="Episode Title"
>

<input
  id="videoUrl"
  placeholder="Video URL"
>

<button
  class="primary"
  onclick="addEpisode()"
>
  Add Episode
</button>

</div>


<!-- EPISODES -->

<div
  id="episodeList"
  class="box"
  style="display:none;"
>

<h2>📺 Episodes</h2>

<div id="episodesContainer"></div>

</div>


</div>

</div>


<script>

const SUPABASE_URL =
"https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let selectedAnime = null;

let animeLibraryData = [];


// =========================
// LOGIN
// =========================

async function loginAdmin(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  message.className = "message";


  if(!email || !password){

    message.className = "message error";

    message.textContent =
      "❌ Email aur password enter karo.";

    return;
  }


  const {
    error
  } = await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });


  if(error){

    message.className = "message error";

    message.textContent =
      "❌ Login failed: " +
      error.message;

    return;
  }


  showAdminPanel();

}


// =========================
// SHOW ADMIN
// =========================

function showAdminPanel(){

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  loadAnimeLibrary();

}


// =========================
// LOGOUT
// =========================

async function logoutAdmin(){

  await supabaseClient.auth.signOut();

  location.reload();

}


// =========================
// ADD ANIME
// =========================

async function addAnime(){

  const animeId =
    document.getElementById("animeId").value.trim();

  const title =
    document.getElementById("animeTitle").value.trim();

  const thumbnail =
    document.getElementById("thumbnail").value.trim();

  const banner =
    document.getElementById("banner").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const genre =
    document.getElementById("genre").value.trim();

  const season =
    document.getElementById("season").value.trim();

  const language =
    document.getElementById("language").value.trim();

  const status =
    document.getElementById("status").value;


  const message =
    document.getElementById("animeMessage");


  message.className = "message";


  if(!animeId || !title){

    message.className = "message error";

    message.textContent =
      "❌ Anime ID aur Anime Name required hai.";

    return;
  }


  const {
    data,
    error
  } = await supabaseClient
    .from("anime")
    .insert([{

      anime_id:animeId,

      title:title,

      thumbnail_url:thumbnail,

      banner_url:banner,

      description:description,

      genre:genre,

      season:season,

      language:language,

      status:status

    }])
    .select();


  if(error){

    message.className = "message error";

    message.textContent =
      "❌ Anime add failed: " +
      error.message;

    return;
  }


  message.className =
    "message success";

  message.textContent =
    "✅ Anime successfully add ho gaya!";


  document
    .getElementById("animeId")
    .value = "";

  document
    .getElementById("animeTitle")
    .value = "";

  document
    .getElementById("thumbnail")
    .value = "";

  document
    .getElementById("banner")
    .value = "";

  document
    .getElementById("description")
    .value = "";

  document
    .getElementById("genre")
    .value = "";

  document
    .getElementById("season")
    .value = "";


  await loadAnimeLibrary();

}


// =========================
// LOAD ANIME LIBRARY
// =========================

async function loadAnimeLibrary(){

  const library =
    document.getElementById("animeLibrary");


  library.innerHTML =
    '<div class="empty">Loading...</div>';


  const {
    data,
    error
  } = await supabaseClient
    .from("anime")
    .select("*")
    .order("anime_id", {
      ascending:false
    });


  if(error){

    library.innerHTML =
      '<div class="empty">❌ ' +
      error.message +
      '</div>';

    return;
  }


  animeLibraryData =
    data || [];


  if(animeLibraryData.length === 0){

    library.innerHTML =
      '<div class="empty">Abhi koi anime add nahi hua.</div>';

    return;
  }


  renderAnimeLibrary(animeLibraryData);

}


// =========================
// RENDER LIBRARY
// =========================

function renderAnimeLibrary(list){

  const library =
    document.getElementById("animeLibrary");


  if(list.length === 0){

    library.innerHTML =
      '<div class="empty">Anime nahi mila.</div>';

    return;
  }


  library.innerHTML = "";


  list.forEach(anime => {


    const item =
      document.createElement("div");

    item.className =
      "anime-item";


    item.onclick = function(){

      selectAnimeFromDatabase(anime);

    };


    const image =
      document.createElement("img");

    image.className =
      "anime-thumb";

    image.src =
      anime.thumbnail_url || "";

    image.onerror =
      function(){

        this.style.display = "none";

      };


    const info =
      document.createElement("div");

    info.className =
      "anime-info";


    info.innerHTML =

      "<h3>" +
      escapeHtml(anime.title || "Untitled") +
      "</h3>" +

      '<div class="small">' +
      "ID: " +
      escapeHtml(anime.anime_id || "-") +
      "</div>" +

      '<div class="status">' +
      escapeHtml(anime.status || "Ongoing") +
      "</div>";


    const actions =
      document.createElement("div");

    actions.className =
      "library-actions";


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.textContent =
      "🗑️ Delete";


    deleteButton.onclick =
      function(event){

        event.stopPropagation();

        deleteAnime(
          anime.anime_id,
          anime.title
        );

      };


    actions.appendChild(deleteButton);


    item.appendChild(image);

    item.appendChild(info);

    item.appendChild(actions);


    library.appendChild(item);

  });

}


// =========================
// DELETE ANIME
// =========================

async function deleteAnime(
  animeId,
  title
){

  console.log(
    "Delete Anime:",
    animeId,
    title
  );


  if(!animeId){

    alert(
      "❌ Anime ID nahi mili."
    );

    return;
  }


  const confirmDelete =
    confirm(

      "⚠️ Kya tum '" +
      title +
      "' ko delete karna chahte ho?\n\n" +

      "Anime permanently delete ho jayega."

    );


  if(!confirmDelete){

    return;

  }


  const message =
    document.getElementById(
      "animeMessage"
    );


  message.className =
    "message success";

  message.textContent =
    "Anime delete ho raha hai...";


  const {
    error
  } = await supabaseClient
    .from("anime")
    .delete()
    .eq(
      "anime_id",
      animeId
    );


  if(error){

    message.className =
      "message error";

    message.textContent =
      "❌ Delete failed: " +
      error.message;

    return;
  }


  if(
    selectedAnime &&
    selectedAnime.id === animeId
  ){

    selectedAnime = null;


    document
      .getElementById("animeDetails")
      .style.display = "none";


    document
      .getElementById("episodeForm")
      .style.display = "none";


    document
      .getElementById("episodeList")
      .style.display = "none";


    document
      .getElementById("episodesContainer")
      .innerHTML = "";

  }


  message.className =
    "message success";


  message.textContent =
    "✅ " +
    title +
    " deleted successfully!";


  await loadAnimeLibrary();

}


// =========================
// SELECT ANIME
// =========================

function selectAnimeFromDatabase(anime){

  selectedAnime = {

    databaseId:
      anime.id,

    id:
      anime.anime_id,

    title:
      anime.title,

    description:
      anime.description || "",

    genres:
      anime.genre
      ? anime.genre
          .split(",")
          .map(g => g.trim())
      : [],

    season:
      anime.season || "-",

    language:
      anime.language || "Hindi",

    status:
      anime.status || "Ongoing",

    thumbnail:
      anime.thumbnail_url || "",

    banner:
      anime.banner_url || ""

  };


  showSelectedAnime();

}


// =========================
// SHOW SELECTED ANIME
// =========================

function showSelectedAnime(){

  const details =
    document.getElementById(
      "animeDetails"
    );


  const info =
    document.getElementById(
      "selectedAnimeInfo"
    );


  details.style.display =
    "block";


  document
    .getElementById("episodeForm")
    .style.display = "block";


  document
    .getElementById("episodeList")
    .style.display = "block";


  info.innerHTML =

    "<h3>" +
    escapeHtml(selectedAnime.title) +
    "</h3>" +

    "<p class='small'>" +
    "Anime ID: " +
    escapeHtml(selectedAnime.id) +
    "</p>" +

    "<p style='margin-top:10px'>" +
    escapeHtml(
      selectedAnime.description
    ) +
    "</p>" +

    "<p style='margin-top:10px'>" +
    "<b>Genre:</b> " +
    escapeHtml(
      selectedAnime.genres.join(", ")
    ) +
    "</p>" +

    "<p style='margin-top:5px'>" +
    "<b>Season:</b> " +
    escapeHtml(
      selectedAnime.season
    ) +
    "</p>" +

    "<p style='margin-top:5px'>" +
    "<b>Language:</b> " +
    escapeHtml(
      selectedAnime.language
    ) +
    "</p>" +

    "<p style='margin-top:5px'>" +
    "<b>Status:</b> " +
    escapeHtml(
      selectedAnime.status
    ) +
    "</p>";


  displayEpisodes();

}


// =========================
// ADD EPISODE
// =========================

async function addEpisode(){

  if(!selectedAnime){

    alert(
      "Pehle anime select karo."
    );

    return;
  }


  const episodeNumber =
    document.getElementById(
      "episodeNumber"
    ).value;


  const episodeTitle =
    document.getElementById(
      "episodeTitle"
    ).value.trim();


  const videoUrl =
    document.getElementById(
      "videoUrl"
    ).value.trim();


  if(
    !episodeNumber ||
    !videoUrl
  ){

    alert(
      "Episode number aur video URL required hai."
    );

    return;
  }


  const {
    error
  } = await supabaseClient
    .from("episodes")
    .insert([{

      anime_id:
        selectedAnime.id,

      anime_title:
        selectedAnime.title,

      episode_number:
        Number(episodeNumber),

      episode_title:
        episodeTitle ||
        "Episode " +
        episodeNumber,

      video_url:
        videoUrl

    }]);


  if(error){

    alert(
      "❌ Episode add failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Episode successfully add ho gaya!"
  );


  document
    .getElementById("episodeNumber")
    .value = "";

  document
    .getElementById("episodeTitle")
    .value = "";

  document
    .getElementById("videoUrl")
    .value = "";


  displayEpisodes();

}


// =========================
// DISPLAY EPISODES
// =========================

async function displayEpisodes(){

  if(!selectedAnime){

    return;

  }


  const container =
    document.getElementById(
      "episodesContainer"
    );


  container.innerHTML =
    '<div class="empty">Loading episodes...</div>';


  const {
    data,
    error
  } = await supabaseClient
    .from("episodes")
    .select("*")
    .eq(
      "anime_id",
      selectedAnime.id
    )
    .order(
      "episode_number",
      {
        ascending:true
      }
    );


  if(error){

    container.innerHTML =
      '<div class="empty">❌ ' +
      error.message +
      '</div>';

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      '<div class="empty">Abhi koi episode add nahi hua.</div>';

    return;
  }


  container.innerHTML = "";


  data.forEach(ep => {


    const div =
      document.createElement("div");

    div.className =
      "episode-item";


    div.innerHTML =

      "<b>Episode " +
      escapeHtml(
        String(ep.episode_number)
      ) +
      "</b>" +

      "<p style='margin-top:5px'>" +
      escapeHtml(
        ep.episode_title || ""
      ) +
      "</p>" +

      "<p style='margin-top:8px'>" +

      "<a href='" +
      escapeAttribute(
        ep.video_url || "#"
      ) +
      "' target='_blank'>" +

      "▶ Watch Video" +

      "</a>" +

      "</p>" +

      "<button " +
      "class='delete-btn' " +
      "onclick='deleteEpisode(" +
      ep.id +
      ")'>" +

      "🗑️ Delete Episode" +

      "</button>";


    container.appendChild(div);

  });

}


// =========================
// DELETE EPISODE
// =========================

async function deleteEpisode(id){

  const confirmDelete =
    confirm(
      "Kya tum ye episode delete karna chahte ho?"
    );


  if(!confirmDelete){

    return;

  }


  const {
    error
  } = await supabaseClient
    .from("episodes")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "❌ Episode delete failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Episode deleted!"
  );


  displayEpisodes();

}


// =========================
// SEARCH
// =========================

document
  .getElementById("animeSearch")
  .addEventListener(
    "input",
    function(){

      const search =
        this.value
          .toLowerCase()
          .trim();


      if(!search){

        renderAnimeLibrary(
          animeLibraryData
        );

        return;
      }


      const filtered =
        animeLibraryData.filter(
          anime =>

            (
              anime.title || ""
            )
            .toLowerCase()
            .includes(search)

            ||

            (
              anime.anime_id || ""
            )
            .toLowerCase()
            .includes(search)
        );


      renderAnimeLibrary(
        filtered
      );

    }
  );


// =========================
// HTML SECURITY
// =========================

function escapeHtml(value){

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value || "")
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// =========================
// CHECK SESSION
// =========================

supabaseClient.auth
  .getSession()
  .then(({data}) => {

    if(
      data &&
      data.session
    ){

      showAdminPanel();

    }

  });


supabaseClient.auth
  .onAuthStateChange(
    (event, session) => {

      if(session){

        showAdminPanel();

      }

    }
  );

</script>

</body>
</html>
