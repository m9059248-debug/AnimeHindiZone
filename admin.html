<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - AnimeHindiZone</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#09090f;
  color:white;
}

header{
  background:#11111b;
  border-bottom:1px solid #292936;
  padding:18px 6%;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:#9b5cff;
  font-size:25px;
  font-weight:800;
}

.home{
  color:#ddd;
  text-decoration:none;
}

.container{
  width:92%;
  max-width:1000px;
  margin:35px auto;
}

h1{
  margin-bottom:25px;
}

.box{
  background:#11111b;
  border:1px solid #292936;
  border-radius:15px;
  padding:22px;
  margin-bottom:22px;
}

h2{
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  border-radius:9px;
  border:1px solid #30303d;
  background:#09090f;
  color:white;
  outline:none;
  font-size:15px;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 20px;
  background:#8239f3;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#9b5cff;
}

.login-box{
  max-width:450px;
  margin:80px auto;
}

.login-box input{
  margin-bottom:12px;
}

.login-btn{
  width:100%;
}

.logout{
  background:#b52b3d;
  padding:10px 15px;
}

.logout:hover{
  background:#d9364f;
}

.status{
  margin-top:12px;
  color:#9b5cff;
}

.search{
  display:flex;
  gap:10px;
}

.results{
  margin-top:15px;
}

.result{
  padding:15px;
  background:#171722;
  border:1px solid #292936;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

.result:hover{
  border-color:#9b5cff;
}

.anime-details{
  display:none;
  grid-template-columns:170px 1fr;
  gap:25px;
}

.poster{
  height:240px;
  border-radius:12px;
  background:
  radial-gradient(circle at 30% 20%,#a45cff66,transparent 35%),
  linear-gradient(145deg,#281044,#0d0d15);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px;
  font-weight:bold;
}

.info h2{
  margin-bottom:10px;
}

.info p{
  color:#aaa;
  line-height:1.6;
  margin-bottom:12px;
}

.tag{
  display:inline-block;
  background:#7135c9;
  padding:6px 10px;
  border-radius:6px;
  margin:3px;
  font-size:12px;
}

.form{
  display:none;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#ccc;
}

.add-btn{
  width:100%;
  margin-top:20px;
}

.message{
  margin-top:15px;
  color:#9b5cff;
}

.episode-item{
  background:#171722;
  border:1px solid #292936;
  border-radius:10px;
  padding:15px;
  margin-top:10px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.delete{
  background:#b52b3d;
  padding:9px 13px;
}

.delete:hover{
  background:#d9364f;
}

.empty{
  color:#888;
}

.hidden{
  display:none !important;
}

@media(max-width:700px){

  .logo{
    font-size:21px;
  }

  .nav{
    flex-wrap:wrap;
  }

  .search{
    flex-direction:column;
  }

  .anime-details{
    grid-template-columns:1fr;
  }

  .poster{
    height:280px;
  }

  .episode-item{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

  <div class="box login-box">

    <h2>🔐 Admin Login</h2>

    <p style="color:#999;margin-bottom:18px;">
      AnimeHindiZone Admin Panel
    </p>

    <input
      id="loginEmail"
      type="email"
      placeholder="Admin email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="login-btn"
      onclick="loginAdmin()"
    >
      Login
    </button>

    <div
      id="loginMessage"
      class="status">
    </div>

  </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel" class="hidden">

<header>

  <div class="nav">

    <div class="logo">
      AnimeHindiZone Admin
    </div>

    <div>

      <a href="index.html" class="home">
        ← Website
      </a>

      <button
        class="logout"
        onclick="logoutAdmin()"
        style="margin-left:10px;"
      >
        Logout
      </button>

    </div>

  </div>

</header>


<main class="container">

  <h1>⚙️ Admin Panel</h1>


  <!-- SEARCH ANIME -->

  <div class="box">

    <h2>🔎 Search Anime</h2>

    <div class="search">

      <input
        id="animeSearch"
        type="text"
        placeholder="Search anime name..."
      >

      <button onclick="searchAnime()">
        Search
      </button>

    </div>

    <div id="results" class="results"></div>

  </div>


  <!-- ANIME DETAILS -->

  <div
    class="box anime-details"
    id="animeDetails"
  >

    <div class="poster" id="poster">
      Anime
    </div>

    <div class="info">

      <h2 id="animeTitle">
        Anime Name
      </h2>

      <p id="animeDescription">
        Description
      </p>

      <p>
        <b>Season:</b>
        <span id="animeSeason">-</span>
      </p>

      <div id="animeTags"></div>

    </div>

  </div>


  <!-- ADD EPISODE -->

  <div
    class="box form"
    id="episodeForm"
  >

    <h2>🎬 Add Episode</h2>

    <label>
      Episode Number
    </label>

    <input
      id="episodeNumber"
      type="number"
      min="1"
      placeholder="Example: 14"
    >

    <label>
      Episode Title
    </label>

    <input
      id="episodeTitle"
      type="text"
      placeholder="Example: New Episode"
    >

    <label>
      Video URL
    </label>

    <input
      id="videoUrl"
      type="url"
      placeholder="https://example.com/video"
    >

    <button
      class="add-btn"
      onclick="addEpisode()"
    >
      ➕ Add Episode
    </button>

    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- EPISODE LIST -->

  <div class="box">

    <h2>📺 Episodes</h2>

    <div id="episodeList">

      <div class="empty">
        Pehle anime search karke select karo.
      </div>

    </div>

  </div>

</main>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
  "https://gmacsiymybvfcxydvkla.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   ANIME DATABASE
========================= */

const animeDatabase = [

  {
    id:"solo-leveling",
    title:"Solo Leveling",
    description:
    "Solo Leveling is an action fantasy anime following a hunter who grows stronger through mysterious powers and challenging battles.",
    genres:["Action","Fantasy","Adventure"],
    season:"Season 2"
  },

  {
    id:"one-piece",
    title:"One Piece",
    description:
    "One Piece follows Monkey D. Luffy and his crew on their adventure across the Grand Line.",
    genres:["Action","Adventure","Fantasy"],
    season:"Multiple Seasons"
  },

  {
    id:"demon-slayer",
    title:"Demon Slayer",
    description:
    "Demon Slayer follows Tanjiro Kamado as he fights demons while searching for a way to help his sister.",
    genres:["Action","Fantasy"],
    season:"Multiple Seasons"
  },

  {
    id:"jujutsu-kaisen",
    title:"Jujutsu Kaisen",
    description:
    "Jujutsu Kaisen follows Yuji Itadori as he enters the world of cursed spirits and jujutsu sorcerers.",
    genres:["Action","Supernatural"],
    season:"Multiple Seasons"
  },

  {
    id:"naruto",
    title:"Naruto",
    description:
    "Naruto follows a young ninja who dreams of becoming the strongest leader of his village.",
    genres:["Action","Adventure"],
    season:"Multiple Seasons"
  },

  {
    id:"attack-on-titan",
    title:"Attack on Titan",
    description:
    "Attack on Titan follows humanity's struggle for survival against mysterious giant Titans.",
    genres:["Action","Drama","Fantasy"],
    season:"Multiple Seasons"
  },

  {
    id:"bleach",
    title:"Bleach",
    description:
    "Bleach follows Ichigo Kurosaki after he gains the powers of a Soul Reaper.",
    genres:["Action","Supernatural"],
    season:"Multiple Seasons"
  },

  {
    id:"dragon-ball",
    title:"Dragon Ball",
    description:
    "Dragon Ball follows Goku and his friends through adventures, battles and powerful opponents.",
    genres:["Action","Adventure"],
    season:"Multiple Seasons"
  }

];


let selectedAnime = null;


/* =========================
   CHECK LOGIN
========================= */

async function checkSession(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();


  if(session){

    showAdminPanel();

  }else{

    showLogin();

  }

}


/* =========================
   LOGIN
========================= */

async function loginAdmin(){

  const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();

  const password =
    document
    .getElementById("loginPassword")
    .value;


  const message =
    document
    .getElementById("loginMessage");


  if(!email || !password){

    message.textContent =
      "Email aur password enter karo.";

    return;
  }


  message.textContent =
    "Login ho raha hai...";


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    message.textContent =
      "❌ " + error.message;

    return;
  }


  if(data.session){

    message.textContent =
      "✅ Login successful!";

    showAdminPanel();

  }

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

  await supabaseClient.auth.signOut();

  selectedAnime = null;

  showLogin();

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
  .getElementById("loginScreen")
  .classList.remove("hidden");


  document
  .getElementById("adminPanel")
  .classList.add("hidden");

}


/* =========================
   SHOW ADMIN
========================= */

function showAdminPanel(){

  document
  .getElementById("loginScreen")
  .classList.add("hidden");


  document
  .getElementById("adminPanel")
  .classList.remove("hidden");

}


/* =========================
   SEARCH ANIME
========================= */

function searchAnime(){

  const input =
    document.getElementById("animeSearch");

  const search =
    input.value
    .toLowerCase()
    .trim();

  const results =
    document.getElementById("results");

  results.innerHTML = "";


  if(!search){

    results.innerHTML =
      '<div class="empty">Anime name enter karo.</div>';

    return;
  }


  const matches =
    animeDatabase.filter(function(anime){

      return anime.title
        .toLowerCase()
        .includes(search);

    });


  if(matches.length === 0){

    results.innerHTML =
      '<div class="empty">Anime nahi mila.</div>';

    return;
  }


  matches.forEach(function(anime){

    const div =
      document.createElement("div");

    div.className = "result";

    div.textContent = anime.title;

    div.onclick = function(){

      selectAnime(anime);

    };

    results.appendChild(div);

  });

}


/* =========================
   ENTER KEY SEARCH
========================= */

document
.getElementById("animeSearch")
.addEventListener("keydown",function(event){

  if(event.key === "Enter"){

    searchAnime();

  }

});


/* =========================
   SELECT ANIME
========================= */

async function selectAnime(anime){

  selectedAnime = anime;


  document
  .getElementById("animeDetails")
  .style.display = "grid";


  document
  .getElementById("episodeForm")
  .style.display = "block";


  document
  .getElementById("animeTitle")
  .textContent =
  anime.title;


  document
  .getElementById("animeDescription")
  .textContent =
  anime.description;


  document
  .getElementById("animeSeason")
  .textContent =
  anime.season;


  document
  .getElementById("poster")
  .textContent =
  anime.title;


  const tags =
    document.getElementById("animeTags");

  tags.innerHTML = "";


  anime.genres.forEach(function(genre){

    const span =
      document.createElement("span");

    span.className = "tag";

    span.textContent = genre;

    tags.appendChild(span);

  });


  document
  .getElementById("results")
  .innerHTML =
  "<div class='result'>✅ Selected: "
  + anime.title +
  "</div>";


  await displayEpisodes();

}


/* =========================
   ADD EPISODE
========================= */

async function addEpisode(){

  if(!selectedAnime){

    alert("Pehle anime select karo.");

    return;
  }


  const number =
    Number(
      document
      .getElementById("episodeNumber")
      .value
    );


  const title =
    document
    .getElementById("episodeTitle")
    .value
    .trim();


  const video =
    document
    .getElementById("videoUrl")
    .value
    .trim();


  const message =
    document
    .getElementById("message");


  if(!number || number < 1){

    alert("Valid episode number enter karo.");

    return;
  }


  if(!video){

    alert("Video URL enter karo.");

    return;
  }


  message.textContent =
    "Episode save ho raha hai...";


  /* Check duplicate in Supabase */

  const {
    data:existing,
    error:checkError
  } =
  await supabaseClient
  .from("episodes")
  .select("id")
  .eq("anime_id",selectedAnime.id)
  .eq("episode_number",number)
  .limit(1);


  if(checkError){

    message.textContent =
      "❌ " + checkError.message;

    return;
  }


  if(existing && existing.length > 0){

    message.textContent =
      "❌ Episode " +
      number +
      " already added hai.";

    return;
  }


  /* Insert episode */

  const {
    error
  } =
  await supabaseClient
  .from("episodes")
  .insert({

    anime_id:selectedAnime.id,

    anime_title:selectedAnime.title,

    episode_number:number,

    episode_title:
      title ||
      "Episode " + number,

    video_url:video

  });


  if(error){

    message.textContent =
      "❌ " + error.message;

    return;
  }


  document
  .getElementById("episodeNumber")
  .value = "";


  document
  .getElementById("episodeTitle")
  .value = "";


  document
  .getElementById("videoUrl")
  .value = "";


  message.textContent =
    "✅ Episode " +
    number +
    " successfully saved!";


  await displayEpisodes();

}


/* =========================
   DISPLAY EPISODES
========================= */

async function displayEpisodes(){

  if(!selectedAnime){

    return;
  }


  const list =
    document.getElementById("episodeList");


  list.innerHTML =
    '<div class="empty">Episodes load ho rahe hain...</div>';


  const {
    data:episodes,
    error
  } =
  await supabaseClient
  .from("episodes")
  .select("*")
  .eq("anime_id",selectedAnime.id)
  .order("episode_number",{ascending:true});


  if(error){

    list.innerHTML =
      '<div class="empty">❌ ' +
      error.message +
      '</div>';

    return;
  }


  if(!episodes || episodes.length === 0){

    list.innerHTML =
      '<div class="empty">Abhi koi episode add nahi hua.</div>';

    return;
  }


  list.innerHTML = "";


  episodes.forEach(function(episode){

    const div =
      document.createElement("div");

    div.className =
      "episode-item";


    const left =
      document.createElement("div");


    const bold =
      document.createElement("b");

    bold.textContent =
      "Episode " +
      episode.episode_number;


    const br =
      document.createElement("br");


    const title =
      document.createElement("span");

    title.style.color = "#999";

    title.textContent =
      episode.episode_title ||
      "Episode " + episode.episode_number;


    left.appendChild(bold);
    left.appendChild(br);
    left.appendChild(title);


    const button =
      document.createElement("button");

    button.className = "delete";

    button.textContent = "Delete";


    button.onclick =
      function(){

        deleteEpisode(episode.id);

      };


    div.appendChild(left);
    div.appendChild(button);

    list.appendChild(div);

  });

}


/* =========================
   DELETE EPISODE
========================= */

async function deleteEpisode(id){

  if(!selectedAnime){

    return;
  }


  const confirmDelete =
    confirm(
      "Kya tum ye episode delete karna chahte ho?"
    );


  if(!confirmDelete){

    return;
  }


  const {
    error
  } =
  await supabaseClient
  .from("episodes")
  .delete()
  .eq("id",id);


  if(error){

    alert(
      "❌ Delete failed: " +
      error.message
    );

    return;
  }


  await displayEpisodes();

}


/* =========================
   AUTH STATE LISTENER
========================= */

supabaseClient
.auth
.onAuthStateChange(function(event,session){

  if(session){

    showAdminPanel();

  }else{

    showLogin();

  }

});


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
